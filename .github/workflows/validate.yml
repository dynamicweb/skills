name: validate

# The one gate on this repo, run on every pull request and every push to main.
# It proves three things: the skills validate structurally (frontmatter, links,
# bundle closure, the Dynamo surface ratchet, MCP tool names and the version
# spine), every shipped PowerShell script parses, and manifest.json is current.
# Dynamo (the Dynamicweb MCP server) fetches manifest.json directly, so a stale
# manifest ships broken discovery to every Dynamo user.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate skills
        run: |
          pip install pyyaml
          python scripts/validate-skills.py
      - name: Parse shipped PowerShell scripts
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem skills -Recurse -File -Include *.ps1, *.psm1 |
            Where-Object { $_.FullName -match '[\/]scripts[\/]' } |
            ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              foreach ($e in $parseErrors) {
                $failures += "$($_.FullName):$($e.Extent.StartLineNumber): $($e.Message)"
              }
            }
          if ($failures) {
            $failures | ForEach-Object { Write-Host "ERROR $_" }
            exit 1
          }
          Write-Host "All shipped PowerShell scripts parse cleanly."
      - name: Verify manifest.json is current
        run: node scripts/build-manifest.mjs --check
